site_name: Neutron Documentation
site_description: Official documentation for the Neutron Programming Language
site_author: yasakei
site_url: https://yasakei.github.io/docs

# Repository
repo_name: yasakei/docs
repo_url: https://github.com/yasakei/docs

# Theme
theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
  logo: logo.svg
  favicon: favicon.ico

# Customization
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yasakei/neutron
    - icon: fontawesome/brands/discuss
      link: https://github.com/yasakei/neutron/discussions
  generator: false

# Extensions
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - meta
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: yasakei
      repo: docs
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Navigation
nav:
  - Home: index.md
  - Guides:
    - index.md
    - Quick Start: quickstart.md
    - Build Guide: build.md
    - Common Pitfalls: common-pitfalls.md
    - Project System: project-system.md
    - Test Suite: test-suite.md
    - Durable Execution: durable-execution.md
  - Reference:
    - index.md
    - Language Reference: language_reference.md
    - Module System: module-system.md
    - Type System: ../type-system.md
    - Box Integration: box-project-integration.md
    - Cross-Platform: cross-platform.md
    - Buffers: buffers.md
    - Syntax Cheat Sheet: syntax-quick-ref.md
  - Modules:
    - index.md
    - Core:
      - sys: sys_module.md
      - json: json_module.md
      - http: http_module.md
      - math: math_module.md
    - Data & Strings:
      - fmt: fmt_module.md
      - strings: strings_module.md
      - arrays: arrays_module.md
      - collections: collections_module.md
    - System & Time:
      - time: time_module.md
      - process: process_module.md
      - path: path_module.md
      - async: async_module.md
    - Utilities:
      - log: log_module.md
      - regex: regex_module.md
      - random: random_module.md
      - crypto: crypto_module.md
  - Implementation:
    - index.md
    - JIT Compilation: jit.md
    - AOT Compilation: aot.md
    - Roadmap: roadmap.md
    - Known Issues: known-issues.md
  - Error Handling:
    - index.md
    - Error Handling Guide: error-handling.md
  - Advanced:
    - Extending Neutron: ../extending-neutron.md
    - LSP Setup: ../lsp.md
  - FAQ: ../faq.md

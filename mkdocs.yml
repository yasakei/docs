site_name: Neutron Documentation
site_description: Official documentation for the Neutron Programming Language
site_author: yasakei
site_url: https://yasakei.github.io/docs

# Repository
repo_name: yasakei/docs
repo_url: https://github.com/yasakei/docs

# Docs directory (docs are in root, not in /docs subfolder)
docs_dir: .

# Theme
theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
  logo: logo.svg
  favicon: favicon.ico

# Customization
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yasakei/neutron
    - icon: fontawesome/brands/discuss
      link: https://github.com/yasakei/neutron/discussions
  generator: false

# Extensions
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - meta
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: yasakei
      repo: docs
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Navigation
nav:
  - Home: index.md
  - Guides:
    - guides/index.md
    - Quick Start: guides/quickstart.md
    - Build Guide: guides/build.md
    - Common Pitfalls: guides/common-pitfalls.md
    - Project System: guides/project-system.md
    - Test Suite: guides/test-suite.md
    - Durable Execution: guides/durable-execution.md
  - Reference:
    - reference/index.md
    - Language Reference: reference/language_reference.md
    - Module System: reference/module-system.md
    - Type System: type-system.md
    - Box Integration: reference/box-project-integration.md
    - Cross-Platform: reference/cross-platform.md
    - Buffers: reference/buffers.md
    - Syntax Cheat Sheet: reference/syntax-quick-ref.md
  - Modules:
    - modules/index.md
    - Core:
      - sys: modules/sys_module.md
      - json: modules/json_module.md
      - http: modules/http_module.md
      - math: modules/math_module.md
    - Data & Strings:
      - fmt: modules/fmt_module.md
      - strings: modules/strings_module.md
      - arrays: modules/arrays_module.md
      - collections: modules/collections_module.md
    - System & Time:
      - time: modules/time_module.md
      - process: modules/process_module.md
      - path: modules/path_module.md
      - async: modules/async_module.md
    - Utilities:
      - log: modules/log_module.md
      - regex: modules/regex_module.md
      - random: modules/random_module.md
      - crypto: modules/crypto_module.md
  - Implementation:
    - implementation/index.md
    - JIT Compilation: implementation/jit.md
    - AOT Compilation: implementation/aot.md
    - Roadmap: implementation/roadmap.md
    - Known Issues: implementation/known-issues.md
  - Error Handling:
    - error_handling/index.md
    - Error Handling Guide: error_handling/error-handling.md
  - Advanced:
    - Extending Neutron: extending-neutron.md
    - LSP Setup: lsp.md
  - FAQ: faq.md
